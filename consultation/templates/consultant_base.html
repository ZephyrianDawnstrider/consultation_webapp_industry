{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Consultant Dashboard{% endblock %}</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- FullCalendar CSS -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.0/main.min.css" rel="stylesheet" />

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet" />

    <!-- Flowbite CSS -->
    <link href="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.css" rel="stylesheet" />

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            background-color: gradient(to right, #000000,rgb(255, 98, 0));
            min-height: 100vh;
            display: flex;
            overflow: auto;
            color: white;
        }
        /* Sidebar Styling */
        .sidebar {
            background-color:gradient(to right, #000000,rgb(255, 98, 0));
            color: white;
            width: 16rem; /* 64 */
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }
        /* Main Content Area */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: auto;
            background-color:gradient(to right, #000000,rgb(255, 98, 0));
        }
        /* Navbar Styling */
        header {
            background-color:gradient(to right, #000000,rgb(255, 98, 0));
            box-shadow: 0 1px 3px rgba(243, 112, 33, 0.5);
            padding: 1rem 1.5rem;
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #F37021;
        }
        main {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
        }

        /* Fix button transparency conflicts between Tailwind and Bootstrap */
        .btn, .btn-danger, .btn-primary, .btn-sm {
            background-color: initial !important;
            opacity: 1 !important;
            border: 1px solid transparent !important;
        }
        .btn-danger {
            background-color: #dc3545 !important; /* Bootstrap danger red */
            color: white !important;
        }
        .btn-primary {
            background-color: #007bff !important; /* Bootstrap primary blue */
            color: white !important;
        }
        .btn-sm {
            padding: 0.25rem 0.5rem !important;
            font-size: 0.875rem !important;
            border-radius: 0.2rem !important;
        }
        /* Ensure Tailwind buttons have solid backgrounds */
        button[class*="bg-"] {
            opacity: 1 !important;
        }
    </style>
</head>
<body>
    {% include 'includes/sidebar.html' %}
    <div class="main-content">
        {% include 'includes/navbar.html' %}
        <main>
            {% block content %}{% endblock %}
        </main>
    </div>
    {% block extra_js %}
    <script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.js"></script>
    {% endblock %}
</body>
</html>
