<style>
    .sidebar {
        transition: all 0.3s ease;
    }
    .sidebar.collapsed {
        width: 4.5rem; /* 70px */
    }
    .sidebar.collapsed .sidebar-text {
        display: none;
    }
    .sidebar.collapsed .logo-text {
        display: none;
    }
    .sidebar.collapsed .menu-item {
        justify-content: center;
    }
    .active-menu {
        background-color: #3b82f6;
        color: white;
    }
    .active-menu:hover {
        background-color: #3b82f6 !important;
    }
</style>

<div id="sidebar" class="sidebar bg-indigo-800 text-white w-64 flex flex-col">
    <div class="p-4 flex items-center border-b border-indigo-700">
        <div class="w-10 h-10 rounded-full bg-indigo-600 flex items-center justify-center text-white font-bold">
            <i class="fas fa-user-tie text-xl"></i>
        </div>
        <span class="logo-text ml-3 text-xl font-semibold">Consultant Pro</span>
    </div>
    
    <div class="flex-1 overflow-y-auto">
        <nav class="mt-6">
            <div class="px-4">
                <div class="text-indigo-300 uppercase text-xs font-semibold tracking-wider sidebar-text">Main</div>
            </div>
            
            <a href="{% url 'consultation:consultant_dashboard' %}" class="menu-item flex items-center px-4 py-3 mt-2 rounded-lg mx-2 {% if current_page == 'Dashboard' %}active-menu{% else %}hover:bg-indigo-700{% endif %}">
                <i class="fas fa-tachometer-alt"></i>
                <span class="sidebar-text ml-3">Dashboard</span>
            </a>
            
            <div class="px-4 mt-6">
                <div class="text-indigo-300 uppercase text-xs font-semibold tracking-wider sidebar-text">Consultation</div>
            </div>
            
            <a href="{% url 'consultation:consultant_timesheet' %}" class="menu-item flex items-center px-4 py-3 mt-2 rounded-lg mx-2 {% if current_page == 'Timesheet Upload' %}active-menu{% else %}hover:bg-indigo-700{% endif %}">
                <i class="fas fa-clock"></i>
                <span class="sidebar-text ml-3">Timesheet Upload</span>
            </a>
            
            <a href="{% url 'consultation:consultant_invoice' %}" class="menu-item flex items-center px-4 py-3 mt-2 rounded-lg mx-2 {% if current_page == 'Invoice Upload' %}active-menu{% else %}hover:bg-indigo-700{% endif %}">
                <i class="fas fa-file-invoice-dollar"></i>
                <span class="sidebar-text ml-3">Invoice Upload</span>
            </a>
            
            <a href="{% url 'consultation:consultant_profile' request.user.id %}" class="menu-item flex items-center px-4 py-3 mt-2 rounded-lg mx-2 {% if current_page == 'Profile Settings' %}active-menu{% else %}hover:bg-indigo-700{% endif %}">
                <i class="fas fa-user-cog"></i>
                <span class="sidebar-text ml-3">Profile</span>
            </a>
        </nav>
    </div>
    
    <div class="p-4 border-t border-indigo-700">
        <button id="toggleSidebar" class="text-indigo-300 hover:text-white">
            <i class="fas fa-chevron-left"></i>
            <span class="sidebar-text ml-2">Collapse</span>
        </button>
    </div>
</div>

<script>
    // Toggle sidebar
    const toggleSidebar = document.getElementById('toggleSidebar');
    const sidebar = document.getElementById('sidebar');
    
    if (toggleSidebar && sidebar) {
        toggleSidebar.addEventListener('click', () => {
            sidebar.classList.toggle('collapsed');
            if (sidebar.classList.contains('collapsed')) {
                toggleSidebar.innerHTML = '<i class="fas fa-chevron-right"></i><span class="sidebar-text ml-2">Expand</span>';
            } else {
                toggleSidebar.innerHTML = '<i class="fas fa-chevron-left"></i><span class="sidebar-text ml-2">Collapse</span>';
            }
        });
    }
</script>
