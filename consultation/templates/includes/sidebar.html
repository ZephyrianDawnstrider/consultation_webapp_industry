<style>
    .sidebar {
        transition: all 0.3s ease;
        background-color: #121212 !important;
        color: #FFFFFF !important;
        position: relative;
        overflow: hidden;
    }
    .sidebar::before {
        content: "";
        position: absolute;
        top: -40px;
        right: -40px;
        width: 120px;
        height: 104px;
        background: repeating-conic-gradient(#F37021 0deg 60deg, transparent 60deg 120deg);
        clip-path: polygon(
            25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%
        );
        opacity: 0.1;
        pointer-events: none;
        z-index: 0;
    }
    .sidebar.collapsed {
        width: 70px;
    }
    .sidebar.collapsed .sidebar-text {
        display: none;
    }
    .sidebar.collapsed .logo-text {
        display: none;
    }
    .sidebar.collapsed .menu-item {
        justify-content: center;
    }
    .active-menu {
        background-color: #F37021 !important;
        color: #FFFFFF !important;
    }
    .active-menu:hover {
        background-color: #cc5a17 !important;
    }
    .menu-item:hover {
        background-color: #cc5a17 !important;
        color: #FFFFFF !important;
    }
    .sidebar-text, .logo-text {
        color: #FFFFFF !important;
    }
    .border-gray-700 {
        border-color: #B0B0B0 !important;
    }
    .p-4.flex.items-center.border-b.border-gray-700 {
        border-color: #B0B0B0 !important;
    }
    .w-10.h-10.rounded-full.bg-blue-500 {
        background-color: #F37021 !important;
        color: #FFFFFF !important;
    }
</style>

{% load static %}
<div id="sidebar" class="sidebar w-64 flex flex-col h-screen flex-shrink-0">
    <!-- Company Logo -->
    <div class="p-4 flex items-center justify-center border-b" style="border-color: #B0B0B0 !important; position: relative; z-index: 1;">
        <img src="/media/logo/logo.png" alt="Company Logo" class="h-12" />
    </div>
    <div class="p-4 flex items-center border-b" style="border-color: #B0B0B0 !important; position: relative; z-index: 1;">
        <div class="w-10 h-10 rounded-full flex items-center justify-center font-bold" style="background-color: #F37021 !important; color: #FFFFFF !important;">
            <i class="fas fa-cog text-xl"></i>
        </div>
        <span class="logo-text ml-3 text-xl font-semibold">Consultant Pro</span>
    </div>
    
    <div class="flex-1 overflow-y-auto relative z-10">
        <nav class="mt-6">
            <div class="px-4">
                <div class="text-xs font-semibold tracking-wider sidebar-text uppercase" style="color: #B0B0B0 !important;">Main</div>
            </div>
            
            <a href="{% url 'consultation:consultant_dashboard' %}" class="menu-item flex items-center px-4 py-3 mt-2 rounded-lg mx-2 {% if current_page == 'Dashboard' %}active-menu{% else %}hover:bg-gray-700{% endif %}">
                <i class="fas fa-tachometer-alt"></i>
                <span class="sidebar-text ml-3">Dashboard</span>
            </a>
            
            <div class="px-4 mt-6">
                <div class="text-xs font-semibold tracking-wider sidebar-text uppercase" style="color: #B0B0B0 !important;">Consultation</div>
            </div>
            
            <a href="{% url 'consultation:consultant_timesheet' %}" class="menu-item flex items-center px-4 py-3 mt-2 rounded-lg mx-2 {% if current_page == 'Timesheet Upload' %}active-menu{% else %}hover:bg-gray-700{% endif %}">
                <i class="fas fa-clock"></i>
                <span class="sidebar-text ml-3">Timesheet Upload</span>
            </a>
            
            <a href="{% url 'consultation:consultant_invoice' %}" class="menu-item flex items-center px-4 py-3 mt-2 rounded-lg mx-2 {% if current_page == 'Invoice Upload' %}active-menu{% else %}hover:bg-gray-700{% endif %}">
                <i class="fas fa-file-invoice-dollar"></i>
                <span class="sidebar-text ml-3">Invoice Upload</span>
            </a>
            
            <a href="{% url 'consultation:consultant_profile' request.user.id %}" class="menu-item flex items-center px-4 py-3 mt-2 rounded-lg mx-2 {% if current_page == 'Profile Settings' %}active-menu{% else %}hover:bg-gray-700{% endif %}">
                <i class="fas fa-user-cog"></i>
                <span class="sidebar-text ml-3">Profile</span>
            </a>
        </nav>
    </div>
    
    <div class="p-4 border-t" style="border-color: #B0B0B0 !important; position: relative; z-index: 1;">
        <button id="toggleSidebar" class="text-gray-400 hover:text-white">
            <i class="fas fa-chevron-left"></i>
            <span class="sidebar-text ml-2">Collapse</span>
        </button>
    </div>
</div>

<script>
    // Toggle sidebar
    const toggleSidebar = document.getElementById('toggleSidebar');
    const sidebar = document.getElementById('sidebar');
    
    if (toggleSidebar && sidebar) {
        toggleSidebar.addEventListener('click', () => {
            sidebar.classList.toggle('collapsed');
            if (sidebar.classList.contains('collapsed')) {
                toggleSidebar.innerHTML = '<i class="fas fa-chevron-right"></i><span class="sidebar-text ml-2">Expand</span>';
            } else {
                toggleSidebar.innerHTML = '<i class="fas fa-chevron-left"></i><span class="sidebar-text ml-2">Collapse</span>';
            }
        });
    }
</script>
