{% extends 'base.html' %}
{% load static %}

{% block title %}Add New Consultant{% endblock %}

{% block content %}
<div class="container bg-gray-800 text-white p-6 rounded-lg shadow-lg">
    <h2 class="text-orange-500 mb-6 text-center text-3xl font-bold">Add New Consultant</h2>
    <form id="consultantForm" action="{% url 'custom_admin:add_consultant' %}" method="POST" enctype="multipart/form-data">
        <div class="form-group mb-4">
            <label for="name" class="h5 block mb-2 font-semibold text-orange-400">Name:</label>
            <input type="text" id="name" name="name" required class="w-full p-3 rounded-md bg-gray-900 text-white border border-orange-500 focus:outline-none focus:ring-2 focus:ring-orange-600" />
        </div>
        <div class="form-group mb-4">
            <label for="mobile" class=" h5 block mb-2 font-semibold text-orange-400">Mobile:</label>
            <input type="tel" id="mobile" name="mobile" required pattern="^\d{10}$" title="Please enter a 10-digit mobile number" class="w-full p-3 rounded-md bg-gray-900 text-white border border-orange-500 focus:outline-none focus:ring-2 focus:ring-orange-600" />
        </div>
        <div class="form-group mb-4">
            <label for="email" class=" h5 block mb-2 font-semibold text-orange-400">Email:</label>
            <input type="email" id="email" name="email" required pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$" title="Please enter a valid email address" class="w-full p-3 rounded-md bg-gray-900 text-white border border-orange-500 focus:outline-none focus:ring-2 focus:ring-orange-600" />
        </div>
        <div class="form-group mb-6">
            <label for="agreement" class="h5 block mb-2 font-semibold text-orange-400">Agreement (PDF only):</label>
            <input type="file" id="agreement" name="agreement" accept=".pdf" required class="w-full p-2 rounded-md bg-gray-900 text-white border border-orange-500 focus:outline-none focus:ring-2 focus:ring-orange-600" />
        </div>
        <button type="submit" class="btn btn-primary d-block ms-auto bg-orange-500 hover:bg-orange-600 border-none px-6 py-3 rounded-md font-semibold text-lg">Save Consultant</button>
    </form>
    <div id="loaderModal" style="display:none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); z-index: 9999; align-items: center; justify-content: center;">
        <div style="background: white; padding: 20px 40px; border-radius: 8px; display: flex; align-items: center; gap: 15px; box-shadow: 0 0 15px rgba(0,0,0,0.3);">
            <div class="spinner" style="width: 30px; height: 30px; border: 4px solid #e0e0e0; border-top: 4px solid #007bff; border-radius: 50%; animation: spin 1s linear infinite;"></div>
            <span style="font-size: 18px; font-weight: bold;">Loading...</span>
        </div>
    </div>
    <div id="responseMessage" class="message" style="display: none;"></div>
</div>
{% endblock %}

{% block extra_css %}
<style>
    .container {
        background-color: #fff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 800px;
        margin: 0 auto;
    }
    h2 {
        text-align: center;
        color: #333;
        margin-bottom: 25px;
    }
    .form-group {
        margin-bottom: 15px;
    }
    label {
        display: block;
        margin-bottom: 5px;
        color: #555;
        font-weight: bold;
    }
    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="file"] {
        width: calc(100% - 22px);
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 16px;
    }
    input[type="file"] {
        padding: 5px; /* Adjust padding for file input */
    }
    .btn {
        background-color: #007bff;
        color:rgb(255, 255, 255);
        padding: 12px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 18px;
        width: fit-content;
        margin-top: 20px;
        display: block;
        margin-left: auto;
        margin-right: 0;
    }
    .btn:hover {
        background-color: #0056b3;
    }
    .message {
        text-align: center;
        margin-top: 20px;
        padding: 10px;
        border-radius: 4px;
        font-weight: bold;
    }
    .message.success {
        background-color: #d4edda;
        color: #155724;
        border-color: #c3e6cb;
    }
    .message.error {
        background-color: #f8d7da;
        color: #721c24;
        border-color: #f5c6cb;
    }
    @keyframes loadingAnimation {
        0% { width: 0; }
        50% { width: 100%; }
        100% { width: 0; }
    }
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
</style>
{% endblock %}

{% block extra_js %}
<script>
    document.getElementById('consultantForm').addEventListener('submit', async function(event) {
        event.preventDefault(); // Prevent default form submission

        const form = event.target;
        const formData = new FormData(form);
        const responseMessageDiv = document.getElementById('responseMessage');
        const loaderDiv = document.getElementById('loaderModal');

        // Show loader and hide response message
        loaderDiv.style.display = 'flex';
        responseMessageDiv.style.display = 'none';

        try {
            const response = await fetch(form.action, {
                method: 'POST',
                body: formData,
                credentials: 'include'
            });

            const result = await response.json(); // Assuming server responds with JSON

            if (result.success) {
                responseMessageDiv.classList.remove('error');
                responseMessageDiv.classList.add('success');
                responseMessageDiv.textContent = result.message;
                form.reset(); // Clear the form
            } else {
                responseMessageDiv.classList.remove('success');
                responseMessageDiv.classList.add('error');
                responseMessageDiv.textContent = result.message;
            }
        } catch (error) {
            responseMessageDiv.classList.remove('success');
            responseMessageDiv.classList.add('error');
            responseMessageDiv.textContent = 'An error occurred. Please try again.';
            console.error('Fetch error:', error);
        }

        // Hide loader and show response message
        loaderDiv.style.display = 'none';
        responseMessageDiv.style.display = 'block';
    });
</script>
{% endblock %}
