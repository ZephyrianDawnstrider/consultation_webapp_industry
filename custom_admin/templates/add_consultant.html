{% extends 'base.html' %}
{% load static %}

{% block title %}Add New Consultant{% endblock %}

{% block content %}
<div class="container">
    <h2>Add New Consultant</h2>
    <form id="consultantForm" action="{% url 'custom_admin:add_consultant' %}" method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
            <label for="mobile">Mobile:</label>
            <input type="tel" id="mobile" name="mobile" required pattern="^\d{10}$" title="Please enter a 10-digit mobile number">
        </div>
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$" title="Please enter a valid email address">
        </div>
        <div class="form-group">
            <label for="agreement">Agreement (PDF only):</label>
            <input type="file" id="agreement" name="agreement" accept=".pdf" required>
        </div>
        <button type="submit" class="btn btn-primary d-block ms-auto">Save Consultant</button>
    </form>
    <div id="responseMessage" class="message" style="display: none;"></div>
</div>
{% endblock %}

{% block extra_css %}
<style>
    .container {
        background-color: #fff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 800px;
        margin: 0 auto;
    }
    h2 {
        text-align: center;
        color: #333;
        margin-bottom: 25px;
    }
    .form-group {
        margin-bottom: 15px;
    }
    label {
        display: block;
        margin-bottom: 5px;
        color: #555;
        font-weight: bold;
    }
    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="file"] {
        width: calc(100% - 22px);
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 16px;
    }
    input[type="file"] {
        padding: 5px; /* Adjust padding for file input */
    }
    .btn {
        background-color: #007bff;
        color:rgb(255, 255, 255);
        padding: 12px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 18px;
        width: fit-content;
        margin-top: 20px;
        display: block;
        margin-left: auto;
        margin-right: 0;
    }
    .btn:hover {
        background-color: #0056b3;
    }
    .message {
        text-align: center;
        margin-top: 20px;
        padding: 10px;
        border-radius: 4px;
        font-weight: bold;
    }
    .message.success {
        background-color: #d4edda;
        color: #155724;
        border-color: #c3e6cb;
    }
    .message.error {
        background-color: #f8d7da;
        color: #721c24;
        border-color: #f5c6cb;
    }
</style>
{% endblock %}

{% block extra_js %}
<script>
    document.getElementById('consultantForm').addEventListener('submit', async function(event) {
        event.preventDefault(); // Prevent default form submission

        const form = event.target;
        const formData = new FormData(form);
        const responseMessageDiv = document.getElementById('responseMessage');

        try {
            const response = await fetch(form.action, {
                method: 'POST',
                body: formData
            });

            const result = await response.json(); // Assuming server responds with JSON

            if (result.success) {
                responseMessageDiv.classList.remove('error');
                responseMessageDiv.classList.add('success');
                responseMessageDiv.textContent = result.message;
                form.reset(); // Clear the form
            } else {
                responseMessageDiv.classList.remove('success');
                responseMessageDiv.classList.add('error');
                responseMessageDiv.textContent = result.message;
            }
        } catch (error) {
            responseMessageDiv.classList.remove('success');
            responseMessageDiv.classList.add('error');
            responseMessageDiv.textContent = 'An error occurred. Please try again.';
            console.error('Fetch error:', error);
        }
        responseMessageDiv.style.display = 'block';
    });
</script>
{% endblock %}
