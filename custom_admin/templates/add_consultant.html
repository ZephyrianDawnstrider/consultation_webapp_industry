{% extends 'base.html' %}
{% load static %}

{% block title %}Add New Consultant{% endblock %}

{% block content %}
<div class="container bg-gray-800 text-white p-6 rounded-lg shadow-lg max-w-9xl mx-auto">
    <h2 class="text-orange-500 mb-2 text-center text-3xl font-bold">Add New Consultant</h2>
    <form id="consultantForm" action="{% url 'custom_admin:add_consultant' %}" method="POST" enctype="multipart/form-data" class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4">
        {% csrf_token %}
        <div class="form-group mb-2">
            <label for="name" class="block mb-2 font-semibold text-orange-400">Name <span class="text-red-600 font-bold">*</span></label>
            <input type="text" id="name" name="name" required class="w-full p-3 rounded-md bg-gray-900 text-white border border-orange-500 focus:outline-none focus:ring-2 focus:ring-orange-600" />
        </div>
        <div class="form-group mb-2">
            <label for="mobile" class="block mb-2 font-semibold text-orange-400">Mobile <span class="text-red-600 font-bold">*</span></label>
            <input type="tel" id="mobile" name="mobile" required pattern="^\d{10}$" title="Please enter a 10-digit mobile number" class="w-full p-3 rounded-md bg-gray-900 text-white border border-orange-500 focus:outline-none focus:ring-2 focus:ring-orange-600" />
        </div>
        <div class="form-group mb-2">
            <label for="email" class="block mb-2 font-semibold text-orange-400">Email <span class="text-red-600 font-bold">*</span></label>
            <input type="email" id="email" name="email" required pattern="[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}$" title="Please enter a valid email address" class="w-full p-3 rounded-md bg-gray-900 text-white border border-orange-500 focus:outline-none focus:ring-2 focus:ring-orange-600" />
        </div>
        <div class="form-group mb-2">
            <label for="countries_multiple" class="block mb-2 font-semibold text-orange-400">Select skills</label>
            <select multiple id="countries_multiple" name="skills[]" placeholder="Select one or more skills..." class="w-full p-3 rounded-md bg-gray-900 text-white border border-orange-500 focus:outline-none focus:ring-2 focus:ring-orange-600">
                <option value="" disabled>Select one or more fields</option>
                {% for skill in skills %}
                <option value="{{ skill.id }}">{{ skill.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group mb-2">
            <label for="linkedin" class="block mb-2 font-semibold text-orange-400">LinkedIn Profile:</label>
            <input type="url" id="linkedin" name="linkedin_profile" placeholder="https://www.linkedin.com/in/your-profile" class="w-full p-3 rounded-md bg-gray-900 text-white border border-orange-500 focus:outline-none focus:ring-2 focus:ring-orange-600" />
        </div>
        <div class="form-group mb-2">
            <label for="total_experience" class="block mb-2 font-semibold text-orange-400">Total Experience (in years):</label>
            <input type="number" id="total_experience" name="total_experience" min="0" step="0.1" class="w-full p-3 rounded-md bg-gray-900 text-white border border-orange-500 focus:outline-none focus:ring-2 focus:ring-orange-600" />
        </div>
        <div class="form-group mb-2">
            <label for="cost_type" class="block mb-2 font-semibold text-orange-400">Cost Type <span class="text-red-600 font-bold">*</span></label>
            <select id="cost_type" name="cost_type" class="w-full p-3 rounded-md bg-gray-900 text-white border border-orange-500 focus:outline-none focus:ring-2 focus:ring-orange-600">
                <option value="hourly" selected>Cost per Hour</option>
                <option value="monthly">Monthly Cost</option>
            </select>
        </div>
        <div class="form-group mb-2">
            <label for="cost" id="cost_label" class="block mb-2 font-semibold text-orange-400">Cost per Hour <span class="text-red-600 font-bold">*</span></label>
            <input type="number" id="cost" name="cost" min="0" step="0.01" placeholder="Enter cost per hour" class="w-full p-3 rounded-md bg-gray-900 text-white border border-orange-500 focus:outline-none focus:ring-2 focus:ring-orange-600" />
        </div>
        <div class="form-group mb-2">
            <label for="weekly_commitment" class="block mb-2 font-semibold text-orange-400">Weekly Commitment (in hours) <span class="text-red-600 font-bold">*</span></label>
            <input type="number" id="weekly_commitment" name="weekly_commitment" min="0" step="0.1" class="w-full p-3 rounded-md bg-gray-900 text-white border border-orange-500 focus:outline-none focus:ring-2 focus:ring-orange-600" />
        </div>
        <div class="form-group mb-2">
            <label for="availability" class="block font-medium text-orange-400">Availability:</label>
            <div id="availability-container" class="border border-orange-500 rounded p-3 mt-1 bg-gray-900">
                <button type="button" class="btn bg-secondary btn-secondary btn-sm mb-3 text-white bg-orange-600 hover:bg-orange-700 rounded px-3 py-1" id="add-availability-btn">Add Availability</button>
                <div id="availability-list" class="text-white"></div>
            </div>
        </div>
        <input type="hidden" id="availability" name="availability" value="" />
        <div class="form-group mb-2">
            <label for="agreement" class="block mb-2 font-semibold text-orange-400">Agreement (PDF only) <span class="text-red-600 font-bold">*</span></label>
            <input type="file" id="agreement" name="agreement" accept=".pdf" required class="w-full p-3 rounded-md bg-gray-900 text-white border border-orange-500 focus:outline-none focus:ring-2 focus:ring-orange-600" />
        </div>
        <div class="form-group md:col-span-2 flex justify-end">
            <button type="submit" class="bg-orange-500 hover:bg-orange-600 text-white font-semibold px-6 py-3 rounded-md text-lg transition focus:outline-none focus:ring-2 focus:ring-orange-600 focus:ring-offset-2">Save Consultant</button>
        </div>
    </form>
    <div id="loaderModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center hidden">
        <div class="bg-gray-800 p-6 rounded-lg flex items-center gap-4 shadow-lg">
            <div class="spinner w-8 h-8 border-4 border-gray-600 border-t-orange-500 rounded-full animate-spin"></div>
            <span class="text-white font-bold text-lg">Loading...</span>
        </div>
    </div>
    <div id="responseMessage" class="message hidden mt-6 p-4 rounded-md font-semibold text-center"></div>
</div>
{% endblock %}

{% block extra_css %}
<style>
    .spinner {
        border-top-color: #f37021;
        animation: spin 1s linear infinite;
    }
    .message.success {
        background-color: #d4edda;
        color: #155724;
        border-color: #c3e6cb;
    }
    .message.error {
        background-color: #f8d7da;
        color: #721c24;
        border-color: #f5c6cb;
    }
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
</style>
<link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.css" rel="stylesheet">
<style>
    /* Custom styles for Tom Select to match dark theme */
    .ts-control, .ts-control input {
        background-color: #1a1a1a !important;
        border-color: #4b5563 !important; /* Tailwind gray-600 */
        color: white !important;
        border-radius: 0.375rem !important; /* rounded-md */
    }
    .ts-dropdown, .ts-option {
        background-color: #2f2f2f !important;
        border-color: #4b5563 !important;
        color: white !important;
    }
    .ts-option.active, .ts-option:hover {
        background-color: #f37021 !important;
        color: white !important;
    }
    .ts-item {
        background-color: #F37021;
        color: white;
        border-radius: 0.25rem;
        margin: 2px;
    }
    .ts-control > .ts-item > .remove-button {
        color: white !important;
        opacity: 0.7;
    }
    .ts-control > .ts-item > .remove-button:hover {
        opacity: 1;
    }
</style>
{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    // Initialize Tom Select for the skills dropdown
    $(document).ready(function() {
        window.countriesSelect = new TomSelect('#countries_multiple',{
            plugins: ['remove_button'],
            maxItems: null
        });

        // Add Availability button handler
        $('#add-availability-btn').off('click').on('click', function() {
            console.log("Add Availability button clicked");
            var availabilityList = $('#availability-list');
            var newAvailabilityId = 'availability_' + Date.now();

            var availabilityDiv = $('<div>', { class: 'mb-3', id: newAvailabilityId });
            var selectInput = $('<select multiple></select>', {
                class: 'form-select',
                name: 'availability[]',
                placeholder: 'Select availability',
                style: 'width: 100%;'
            });

            var days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
            days.forEach(function(day) {
                selectInput.append($('<option>', { value: day, text: day }));
            });

            availabilityDiv.append(selectInput);

            // Add container for time ranges per selected day
            var timeRangesContainer = $('<div id="availability-time-ranges-container" class="time-ranges-container mt-3"></div>');
            availabilityDiv.append(timeRangesContainer);

            availabilityList.append(availabilityDiv);

            if (typeof TomSelect === 'undefined') {
                console.error("TomSelect is not loaded");
            } else {
                var tomSelectInstance = new TomSelect(selectInput[0], {
                    plugins: ['remove_button'],
                    maxItems: null,
                    create: false,
                    backgroundColor: '#007bff',
                    placeholder: 'Select availability days',
                    onChange: function(values) {
                        console.log("TomSelect onChange fired with values:", values);
                        // Update time range inputs based on selected days
                        timeRangesContainer.empty();

                        // For each selected day, add time range inputs
                        values.forEach(function(day) {
                            var dayDiv = $('<div>', { class: 'day-time-range mb-3', 'data-day': day });
                            var dayLabel = $('<label>', { text: day, class: 'form-label fw-bold' });
                            var addTimeRangeBtn = $('<button>', { type: 'button', class: 'btn btn-sm btn-outline-primary ms-2 mb-2 add-time-range' }).text('Add Time Range');
                            var dayTimeRanges = $('<div>', { class: 'day-time-ranges' });

                            addTimeRangeBtn.on('click', function() {
                                var timeRangeDiv = $('<div>', { class: 'time-range d-flex align-items-center mb-2' });
                                var startInput = $('<input>', { type: 'time', class: 'form-control me-2 start-time', name: `start_time_${day}[]` });
                                var toSpan = $('<span>', { class: 'me-2' }).text('to');
                                var endInput = $('<input>', { type: 'time', class: 'form-control end-time', name: `end_time_${day}[]` });
                                var removeBtn = $('<button>', { type: 'button', class: 'btn bg-danger btn-danger btn-sm ms-2' }).text('Remove');

                                removeBtn.on('click', function() {
                                    timeRangeDiv.remove();
                                });

                                timeRangeDiv.append(startInput, toSpan, endInput, removeBtn);
                                dayTimeRanges.append(timeRangeDiv);
                            });

                            // Add one default time range input
                            addTimeRangeBtn.click();

                            dayDiv.append(dayLabel, addTimeRangeBtn, dayTimeRanges);
                            timeRangesContainer.append(dayDiv);
                        });
                    }
                });
            }
        });

        // Cost type change handler
        function updateCostLabel() {
            console.log("updateCostLabel called");
            var costType = $('#cost_type').val();
            var label = costType === 'hourly' ? 'Cost per Hour:<span class="text-danger">*</span>' : 'Monthly Cost:<span class="text-danger">*</span>';
            $('#cost_label').html(label);
            var placeholder = costType === 'hourly' ? 'Enter cost per hour' : 'Enter monthly cost';
            $('#cost').attr('placeholder', placeholder);
            // Also clear the cost input value when cost type changes
            $('#cost').val('');
        }
        $('#cost_type').on('change', updateCostLabel);
        updateCostLabel();

        // Handle form submission with AJAX
        $('#consultantForm').on('submit', function(e) {
            e.preventDefault();
            
            // Show loader
            $('#loaderModal').removeClass('hidden');
            $('#responseMessage').addClass('hidden');
            
            // Create FormData object
            var formData = new FormData(this);
            
            // Get CSRF token
            var csrfToken = $('[name=csrfmiddlewaretoken]').val();
            if (!csrfToken) {
                csrfToken = document.querySelector('[name=csrfmiddlewaretoken]')?.value || '';
            }
            
            // Send AJAX request
            $.ajax({
                url: $(this).attr('action'),
                type: 'POST',
                data: formData,
                processData: false,
                contentType: false,
                headers: {
                    'X-CSRFToken': csrfToken
                },
                success: function(response) {
                    $('#loaderModal').addClass('hidden');
                    if (response.success) {
                        $('#responseMessage')
                            .removeClass('hidden error')
                            .addClass('success')
                            .text(response.message);
                        // Reset form
                        $('#consultantForm')[0].reset();
                        // Reset TomSelect
                        if (window.countriesSelect) {
                            window.countriesSelect.clear();
                        }
                    } else {
                        $('#responseMessage')
                            .removeClass('hidden success')
                            .addClass('error')
                            .text(response.message || 'An error occurred');
                    }
                },
                error: function(xhr, status, error) {
                    $('#loaderModal').addClass('hidden');
                    var errorMessage = 'An error occurred';
                    if (xhr.responseJSON && xhr.responseJSON.message) {
                        errorMessage = xhr.responseJSON.message;
                    }
                    $('#responseMessage')
                        .removeClass('hidden success')
                        .addClass('error')
                        .text(errorMessage);
                }
            });
        });
    });
</script>
{% endblock %}
