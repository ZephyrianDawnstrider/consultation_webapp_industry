{% load static %}
<header class="bg-black shadow-sm">
    <div class="flex items-center justify-between px-6 py-3">
        <div class="flex items-center">
            <button id="mobileMenuButton" class="text-orange-500 focus:outline-none lg:hidden">
                <i class="fas fa-bars text-xl"></i>
            </button>
            <h1 class="text-xl font-semibold text-white ml-4">{{ current_page }}</h1>
        </div>
        
        <div class="flex items-center space-x-4">
            <div class="relative inline-block text-left">
                <button id="profileDropdownButton" type="button" class="inline-flex justify-center w-full rounded-md border border-orange-500 shadow-sm px-4 py-2 bg-black text-sm font-medium text-orange-500 hover:bg-orange-600 hover:text-white focus:outline-none cursor-pointer" aria-expanded="true" aria-haspopup="true">
                    <div class="w-8 h-8 rounded-full bg-orange-500 flex items-center justify-center text-white font-bold mr-2">
                        <i class="fas fa-user"></i>
                    </div>
                    {{ request.user.first_name }}
                    <svg class="-mr-1 ml-2 h-5 w-5 text-orange-500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                        <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.293l3.71-4.06a.75.75 0 111.08 1.04l-4.25 4.65a.75.75 0 01-1.08 0l-4.25-4.65a.75.75 0 01.02-1.06z" clip-rule="evenodd" />
                    </svg>
                </button>
                <div id="profileDropdown" class="hidden origin-top-right absolute right-0 mt-2 w-56 rounded-md shadow-lg bg-black ring-1 ring-orange-500 ring-opacity-50 focus:outline-none z-10" role="menu" aria-orientation="vertical" aria-labelledby="profileDropdownButton" tabindex="-1">
                    <div class="py-1" role="none">
                        {% if request.user.id %}
                        <a href="{% url 'custom_admin:admin_profile' request.user.id %}" class="text-orange-500 block px-4 py-2 text-sm hover:bg-orange-600 hover:text-white cursor-pointer" role="menuitem" tabindex="-1" id="menu-item-0">
                            <i class="fas fa-user mr-2"></i> Admin Profile
                        </a>
                        {% endif %}
                        <a href="{% url 'custom_admin:logout' %}" class="text-orange-500 block px-4 py-2 text-sm hover:bg-orange-600 hover:text-white cursor-pointer" role="menuitem" tabindex="-1" id="menu-item-1">
                            <i class="fas fa-sign-out-alt mr-2"></i> Logout
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        console.log('DOM fully loaded and parsed');

        // Mobile menu toggle
        const mobileMenuButton = document.getElementById('mobileMenuButton');
        const sidebar = document.getElementById('sidebar');
        if (mobileMenuButton) {
            console.log('Attaching mobileMenuButton click listener');
            mobileMenuButton.addEventListener('click', () => {
                if (sidebar) {
                    sidebar.classList.toggle('hidden');
                }
            });
        }

        // Profile dropdown toggle with Tailwind UI style
        const profileDropdownButton = document.getElementById('profileDropdownButton');
        const profileDropdown = document.getElementById('profileDropdown');

        if (profileDropdownButton && profileDropdown) {
            console.log('Attaching profileDropdownButton click listener');
            profileDropdownButton.addEventListener('click', (event) => {
                event.stopPropagation(); // Prevent event from bubbling up to document
                profileDropdown.classList.toggle('hidden');
                console.log('Toggled profileDropdown visibility');
            });

            // Close dropdown when clicking outside
            document.addEventListener('click', (event) => {
                if (!profileDropdownButton.contains(event.target) && !profileDropdown.contains(event.target)) {
                    profileDropdown.classList.add('hidden');
                    console.log('Clicked outside, hiding profileDropdown');
                }
            });
        }
    });
</script>
