<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Consultant Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .success-message {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-2xl w-full">
        <!-- Form Container -->
        <div id="consultantDetailsForm" class="bg-white rounded-xl shadow-lg overflow-hidden transition-all duration-300">
            <!-- Header -->
            <div class="bg-blue-600 py-6 px-8 text-white">
                <h1 class="text-2xl font-bold">New Consultant Details</h1>
                <p class="text-blue-100 mt-1">Submit your details to become a consultant</p>
            </div>
            
            <!-- Form -->
            <form id="consultantForm" class="p-8" method="POST" action="/new_consultant_details/">
                <div class="space-y-6">
                    <!-- Name Field -->
                    <div>
                        <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fas fa-user text-gray-400"></i>
                            </div>
                            <input type="text" id="name" name="name" required
                                class="pl-10 w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
                                placeholder="John Doe">
                        </div>
                    </div>
                    
                    <!-- Email Field -->
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fas fa-envelope text-gray-400"></i>
                            </div>
                            <input type="email" id="email" name="email" required
                                class="pl-10 w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
                                placeholder="john@example.com">
                        </div>
                    </div>
                    
                    <!-- Phone Field -->
                    <div>
                        <label for="phone" class="block text-sm font-medium text-gray-700 mb-1">Phone Number</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fas fa-phone text-gray-400"></i>
                            </div>
                            <input type="tel" id="phone" name="phone" required
                                class="pl-10 w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
                                placeholder="(123) 456-7890">
                        </div>
                    </div>
                    
                    <!-- Consultant Field Dropdown -->
                    <div>
                        <label for="consultantField" class="block text-sm font-medium text-gray-700 mb-1">Consultant Field</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fas fa-briefcase text-gray-400"></i>
                            </div>
                            <select id="consultantField" name="consultant_field" required
                                class="pl-10 appearance-none w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition bg-white">
                                <option value="" disabled selected>Select a field</option>
                                <option value="Business Strategy">Business Strategy</option>
                                <option value="Financial Planning">Financial Planning</option>
                                <option value="Legal Advice">Legal Advice</option>
                                <option value="Career Counseling">Career Counseling</option>
                                <option value="Health & Wellness">Health & Wellness</option>
                                <option value="Technology">Technology</option>
                                <option value="Other">Other</option>
                            </select>
                            <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                                <i class="fas fa-chevron-down text-gray-400"></i>
                            </div>
                        </div>
                    </div>

                    <!-- Additional Consultant Field for 'Other' -->
                    <div id="otherconsultantFieldContainer" class="hidden">
                        <label for="otherconsultantField" class="block text-sm font-medium text-gray-700 mb-1">Please specify</label>
                        <input type="text" id="otherconsultantField" name="other_consultant_field"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
                            placeholder="Specify your consultant field">
                    </div>
                    <!-- LinkedIn Field -->
                    <div>
                        <label for="linkedin" class="block text-sm font-medium text-gray-700 mb-1">LinkedIn Profile</label> 
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fab fa-linkedin text-gray-400"></i>
                            </div>
                            <input type="url" id="linkedin" name="linkedin" 
                                class="pl-10 w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
                                placeholder="https://www.linkedin.com/in/yourprofile">
                        </div>
                    </div>
                    <!-- Submit Button -->
                    <div class="pt-2">
                        <button type="submit"
                            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-lg transition duration-300 transform hover:scale-[1.01] focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                            Submit Details
                        </button>
                    </div>
                </div>
            </form>
        </div>
        
        <!-- Success Message (Hidden by default) -->
        <div id="successMessage" class="hidden success-message text-white rounded-xl shadow-lg p-8 fade-in">
            <div class="text-center">
                <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-white bg-opacity-20 mb-4">
                    <i class="fas fa-check text-xl"></i>
                </div>
                <h2 class="text-2xl font-bold mb-2">Submission Confirmed!</h2>
                <p class="mb-6">Thank you for submitting your details. We'll get back to you shortly.</p>
                <button id="newSubmissionBtn"
                    class="bg-white text-blue-600 hover:bg-gray-100 font-medium py-2 px-6 rounded-lg transition">
                    Submit Another
                </button>
            </div>
        </div>
    </div>

<script>
        document.addEventListener('DOMContentLoaded', function() {
            const consultantField = document.getElementById('consultantField');
            const otherconsultantFieldContainer = document.getElementById('otherconsultantFieldContainer');

            // Initialize visibility on page load
            if (consultantField.value === 'Other') {
                otherconsultantFieldContainer.classList.remove('hidden');
            } else {
                otherconsultantFieldContainer.classList.add('hidden');
            }

            consultantField.addEventListener('change', function() {
                if (this.value === 'Other') {
                    otherconsultantFieldContainer.classList.remove('hidden');
                } else {
                    otherconsultantFieldContainer.classList.add('hidden');
                }
            });

            // Trigger change event on page load to set correct visibility
            consultantField.dispatchEvent(new Event('change'));

            const form = document.getElementById('consultantForm');
            const consultantDetailsForm = document.getElementById('consultantDetailsForm');
            const successMessage = document.getElementById('successMessage');
            const newSubmissionBtn = document.getElementById('newSubmissionBtn');
            
            form.addEventListener('submit', function(e) {
                e.preventDefault();

                const formData = new FormData(form);

                fetch(form.action, {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-CSRFToken': getCookie('csrftoken')
                    }
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        consultantDetailsForm.classList.add('hidden');
                        successMessage.classList.remove('hidden');
                        successMessage.classList.add('fade-in');
                        form.reset();
                        otherconsultantFieldContainer.classList.add('hidden');
                    } else {
                        alert('Error: ' + JSON.stringify(data.errors));
                    }
                })
                .catch(error => {
                    alert('An error occurred: ' + error);
                });
            });

            newSubmissionBtn.addEventListener('click', function() {
                successMessage.classList.add('hidden');
                consultantDetailsForm.classList.remove('hidden');
            });

            function getCookie(name) {
                let cookieValue = null;
                if (document.cookie && document.cookie !== '') {
                    const cookies = document.cookie.split(';');
                    for (let i = 0; i < cookies.length; i++) {
                        const cookie = cookies[i].trim();
                        // Does this cookie string begin with the name we want?
                        if (cookie.substring(0, name.length + 1) === (name + '=')) {
                            cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                            break;
                        }
                    }
                }
                return cookieValue;
            }
        });
    </script>
</body>
</html>
